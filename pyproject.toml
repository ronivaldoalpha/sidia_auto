[project]
name = "sidia-manolo"
version = "0.1.0-beta"
description = "Aplicativo Flet para centralização Vault Site e Digifort"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Ronivaldo", email = "ronivaldo.alpha@gmail.com" }
]
dependencies = [
    "flet>=0.86.5",
    "flet-charts>=0.86.5",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "br.com.alphaformat"
product = "Sidia Manolo"
company = "AlphaFormat"
copyright = "Copyright (C) 2023-2026 by AlphaFormat"

[tool.flet.app]
path = "src"
