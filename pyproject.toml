[project]
name = "vault-site"
version = "0.1.0"
description = "Aplicativo Flet para centralização Vault Site e Digifort"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=0.86.5",
    "flet-charts>=0.86.5",
    "SQLAlchemy>=2.0,<3",
    "pyodbc>=5.0",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "br.com.sidia"
product = "Vault Site"
company = "Sidia"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"
